name: Mac x64 DMG (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin deployment target
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.14" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: x86_64-apple-darwin
          save-cache: true
          restore-cache: true
          cache-namespace: nightly-cache

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        run: cargo build --release --bin oneclient_app --target x86_64-apple-darwin

      - name: Compile app icon catalog
        run: |
          set -euo pipefail
          out="packages/oneclient_app/icons/generated"
          mkdir -p "$out"
          xcrun actool "packages/oneclient_app/icons/OneClient.icon" \
            --compile "$out" \
            --app-icon OneClient \
            --output-partial-info-plist "$out/partial.plist" \
            --platform macosx \
            --minimum-deployment-target 26.0 \
            --errors --warnings --notices
          rm -f "$out/OneClient.icns"
          test -f "$out/Assets.car"

      - name: Package DMG
        env:
          CI: 'true'
        run: cargo packager --release --formats app,dmg --target x86_64-apple-darwin --verbose

      - name: Collect DMG
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/bundle/dmg/*.dmg dist/ || cp target/x86_64-apple-darwin/release/*.dmg dist/
          ls -la dist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: tcc-mac-x64-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
