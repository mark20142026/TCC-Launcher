name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting (non-blocking)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Run clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      - name: Package installer (Windows)
        run: |
          cargo install cargo-packager --locked
          cargo packager --release -p tcc_app --formats nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: tcc-launcher-installer
          path: target/release/bundle/nsis/*.exe
          retention-days: 7

  release:
    name: Create Release
    needs: [build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: tcc-launcher-installer
          path: ./installer

      - name: Generate update manifest
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os
          from datetime import datetime, timezone

          ref = os.environ["GITHUB_REF_NAME"]
          tag = ref.removeprefix("v")
          installers = sorted(glob.glob("./installer/*.exe"))
          if not installers:
              raise SystemExit("no installer artifact found")
          exe = installers[0]
          sha256 = hashlib.sha256(open(exe, "rb").read()).hexdigest()
          url = "https://github.com/{}/releases/download/{}/{}".format(
              os.environ["GITHUB_REPOSITORY"],
              ref,
              os.path.basename(exe),
          )
          manifest = {
              "name": "TCC Launcher",
              "version": tag,
              "notes": "TCC Launcher {}".format(tag),
              "pub_date": datetime.now(timezone.utc).isoformat(),
              "platforms": {
                  "windows-x64": {"url": url, "sha256": sha256},
              },
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./installer/*.exe
            ./latest.json
          generate_release_notes: true
