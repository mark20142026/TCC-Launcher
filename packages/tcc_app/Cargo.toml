[package]
name = "tcc_app"
description = "TCC Launcher Freya App"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }

[[bin]]
name = "tcc-launcher"
path = "src/main.rs"

[features]
default = []

[dependencies]
tcc_auth.workspace = true
tcc_cluster.workspace = true
tcc_common.workspace = true
tcc_content.workspace = true
tcc_events.workspace = true
tcc_java.workspace = true
tcc_mc.workspace = true
tcc_polyplus.workspace = true
tcc_net.workspace = true
tcc_core.workspace = true
tcc_db.workspace = true
chrono.workspace = true
tcc_macro = { workspace = true, features = ["freya"] }

polyio.workspace = true
rust-embed.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
uuid.workspace = true
bytes.workspace = true
sysinfo.workspace = true

anyhow.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true

rfd = "=0.17.2"
open = "=5.4.0"

# clipboard image copy + decode for it
arboard.workspace = true
image.workspace = true

freya-skia-safe.workspace = true
freya.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = "=0.1.52"

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"

[package.metadata.packager]
product-name = "TCC Launcher"
identifier = "com.tcc.launcher"
category = "Game"
publisher = "TCC Launcher"
copyright = "© 2026 TCC Launcher Contributors"
homepage = "https://github.com/pnbx/TCC-Launcher"
long-description = "TCC Launcher - Offline Minecraft Launcher"
formats = ["nsis"]
binaries = [{ path = "tcc-launcher", main = true }]
icons = [
  "icons/32x32.png",
  "icons/64x64.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.ico",
]

[package.metadata.packager.windows]
digest-algorithm = "sha256"
timestamp-url = "https://timestamp.digicert.com"

[package.metadata.packager.nsis]
preinstall-section = """
Section "-TCCLauncherMigration"
  ; Clean up any old installations
SectionEnd

Section "-VCRedist"
  SetRegView 64
  ReadRegDWORD $R0 HKLM "SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64" "Installed"
  ReadRegDWORD $R1 HKLM "SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64" "Minor"
  SetRegView lastused

  ${If} $R0 == 1
  ${AndIf} $R1 >= 40
    Goto vcredist_done
  ${EndIf}

  DetailPrint "Installing Microsoft Visual C++ Redistributable (x64)..."
  nsis_tauri_utils::Download "https://aka.ms/vs/17/release/vc_redist.x64.exe" "$PLUGINSDIR\\vc_redist.x64.exe"
  Pop $R2
  ${If} $R2 == 0
    ExecWait '"$PLUGINSDIR\\vc_redist.x64.exe" /quiet /norestart' $R3
    ${If} $R3 == 3010
      SetRebootFlag true
    ${EndIf}
  ${ElseIf} $PassiveMode != 1
    MessageBox MB_OK|MB_ICONEXCLAMATION "Could not download the Microsoft Visual C++ Redistributable. TCC Launcher may fail to start until you install it manually from https://aka.ms/vs/17/release/vc_redist.x64.exe"
  ${EndIf}
  vcredist_done:
SectionEnd
"""